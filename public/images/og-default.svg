<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="og-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070E"/>
      <stop offset="50%" stop-color="#0C1021"/>
      <stop offset="100%" stop-color="#140B29"/>
    </linearGradient>
    <linearGradient id="og-text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <radialGradient id="og-glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="rgba(99, 102, 241, 0.3)"/>
      <stop offset="100%" stop-color="rgba(99, 102, 241, 0)"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#og-bg)"/>
  <rect width="1200" height="630" fill="url(#og-glow)"/>
  
  <!-- Subtle Grid lines -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="500" y1="0" x2="500" y2="630"/>
    <line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
  </g>

  <!-- Brand badge -->
  <rect x="90" y="80" width="48" height="48" rx="14" fill="url(#og-text)"/>
  <text x="114" y="113" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="28" text-anchor="middle">P</text>
  <text x="154" y="112" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="800" font-size="24" letter-spacing="2">PAOJICHANG.BLOG</text>

  <!-- Main Headline -->
  <text x="90" y="270" fill="url(#og-text)" font-family="system-ui, sans-serif" font-weight="900" font-size="56" letter-spacing="-1">泡机场技术周刊 &amp; 极客空间</text>
  <text x="90" y="340" fill="#E2E8F0" font-family="system-ui, sans-serif" font-weight="700" font-size="34">高性能网络架构 • 边缘计算 • 现代全栈工程</text>
  
  <text x="90" y="420" fill="#94A3B8" font-family="system-ui, sans-serif" font-weight="400" font-size="22">探索分布式网络优化与 Astro 7 静态极速呈现的独立数字花园</text>

  <!-- Bottom Bar -->
  <line x1="90" y1="520" x2="1110" y2="520" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="90" y="565" fill="#64748B" font-family="monospace" font-size="18">DOMAIN // https://paojichang.blog</text>
  <text x="1110" y="565" fill="#818CF8" font-family="monospace" font-size="18" text-anchor="end">STATUS // 100% INDEPENDENT &amp; SEO OPTIMIZED</text>
